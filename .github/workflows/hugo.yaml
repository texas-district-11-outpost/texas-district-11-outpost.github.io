name: Build and deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_checkout:
        description: 'Full checkout (all files and git history) instead of the default shallow one'
        type: boolean
        default: false
  # Rebuild every 15 minutes on Election Day so /wait-times stays fresh.
  # Cron is in UTC; Central (CST) is UTC-6. These cover 7:00am-11:45pm Central
  # on Nov 3. Cron has no year, so the election-day gate job below also
  # requires the Central date to equal ELECTION_DATE.
  # For the next election: update both crons, ELECTION_DATE, and the iframe
  # URLs in content/wait-times.md.
  schedule:
    - cron: '*/15 13-23 3 11 *'
    - cron: '*/15 0-5 4 11 *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  ELECTION_DATE: '2026-11-03'
jobs:
  # Lets pushes and manual runs through; lets scheduled runs through only on
  # ELECTION_DATE (Central time). Otherwise the build and deploy are skipped.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          TZ: America/Chicago
          EVENT: ${{ github.event_name }}
        run: |
          today=$(date +%F)
          if [[ "$EVENT" != "schedule" || "$today" == "$ELECTION_DATE" ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Scheduled run on $today, not $ELECTION_DATE; skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      DART_SASS_VERSION: 1.93.2
      GO_VERSION: 1.25.1
      HUGO_VERSION: 0.151.0
      NODE_VERSION: 22.18.0
      TZ: America/Chicago
    steps:
      # Only when run by hand with the "Full checkout" box ticked:
      # every file plus complete git history.
      - name: Checkout (full)
        if: inputs.full_checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      # Default for pushes, timer runs, and manual runs: shallow checkout.
      # Latest commit only, and skip the ~1 GB of
      # plan-maps the site doesn't use (the wait-times scraper needs only
      # plan-maps/just-tx11). Non-cone patterns: "/*" + "!/*/" keeps root files
      # (config.yaml, hugo.yaml) but no directories, then the listed
      # directories are added. If the site starts depending on a new top-level
      # directory, add it here too.
      - name: Checkout (shallow)
        if: ${{ !inputs.full_checkout }}
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /archetypes/
            /assets/
            /content/
            /layouts/
            /static/
            /themes/
            /tools/
            /plan-maps/just-tx11/
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Create directory for user-specific executable files
        run: |
          mkdir -p "${HOME}/.local"
      - name: Install Dart Sass
        run: |
          curl -sLJO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          rm "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"
      - name: Install Hugo
        run: |
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      - name: Verify installations
        run: |
          echo "Dart Sass: $(sass --version)"
          echo "Go: $(go version)"
          echo "Hugo: $(hugo version)"
          echo "Node.js: $(node --version)"
      - name: Install Node.js dependencies
        run: |
          [[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true
      - name: Configure Git
        run: |
          git config core.quotepath false
      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-
      - name: Refresh polling place wait times
        # Only on the timer or a manual run; ordinary pushes keep the committed snapshot.
        if: github.event_name != 'push'
        run: |
          ruby --version
          ruby tools/wait_times.rb "$ELECTION_DATE"
      - name: Build the site
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/hugo_cache"
      - name: Cache save
        id: cache-save
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
